site_name: 算法笔记
site_description: 面向笔试与竞赛的 Python 算法教程
site_url: https://algorithm.ebook.ttzg.site/
repo_name: w3903771/algorithm
repo_url: https://github.com/w3903771/algorithm

# 审计类文件供仓库维护使用，不作为教程站点内容发布。
exclude_docs: |
  00-*.md

theme:
  name: material
  language: zh
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: 切换为深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: 切换为浅色模式
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search:
      lang: zh

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  # MkDocs 默认的 slugify 会剥掉所有非 ASCII 字符，中文标题的锚点会退化成 _1、_2……
  # 换成 pymdownx 的 Unicode 版，锚点才会保留中文，跨章节的 #锚点 链接也才能命中。
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

