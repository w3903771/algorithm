markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  # 行内 $...$ 与独立 $$...$$ 交给 MathJax 渲染；
  # generic 模式产出 \(...\)，不依赖 MathJax 自己扫 $ 符号。
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  # MkDocs 默认的 slugify 会剥掉所有非 ASCII 字符，中文标题的锚点会退化成 _1、_2……
  # 换成 pymdownx 的 Unicode 版，锚点才会保留中文，跨章节的 #锚点 链接也才能命中。
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

