site_name: 算法笔记
site_description: 面向笔试与竞赛的 Python 算法教程
site_url: https://algorithm.ebook.ttzg.site/
repo_name: w3903771/algorithm
repo_url: https://github.com/w3903771/algorithm

theme:
  name: material
  custom_dir: overrides    # overrides/main.html：往每页 <head> 注入 Cloudflare Web Analytics
  language: zh
  # 标题栏图标与浏览器标签页图标。两份是同一张图的不同尺寸：
  # logo 512（顶栏会缩到 24px，但高分屏要两倍图）、favicon 128。
  # 母版 docs/assets/logo-source.png 1254×1254 留着，改尺寸时从它重新缩。
  logo: assets/logo.png
  favicon: assets/favicon.png
  # 不走 Google Fonts：国内加载慢甚至超时，字体栈在 stylesheets/extra.css 里定义。
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: 切换到深色
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色
  features:
    - navigation.tabs          # 十个部分做顶部标签，侧栏只显示当前部分
    - navigation.indexes       # 部分索引页挂到部分标题上，省掉一行「学习索引」
    - navigation.tracking      # 地址栏跟随当前小节，方便复制深链
    - navigation.top
    - navigation.footer        # 上一章 / 下一章
    - navigation.instant
    - navigation.instant.progress
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tooltips
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/table-filter.js
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

# 构建期生成题解页、注入章节盘。scripts/ 不入库，构建期代码放 hooks/。
